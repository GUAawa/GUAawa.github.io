<!DOCTYPE html>
<html lang="en">

<body>
    <h4>基础操作</h4>
    游戏没有为移动端设备做适配，至少目前没有。<br>
    按住 wasd 移动视角。<br>
    右侧菜单可以查看光标控制状态，输入配置内容，切换状态，查看文档。<br>
    光标在建筑模式下左键放置，右键拆除。<br>
    光标在燃烧链素模式下左键删除链素。这会消耗一些储蓄的时间。<br>
    <h4>快捷键</h4>
    数字键切换建筑模式-运输器。<br>
    shift + 字母切换建筑模式-基座。<br>
    backspace 切换燃烧链素模式。
</body>
</html>
