<body>
    <h4>催化剂</h4>
    <p>催化剂是执行字母学反应的结构。由基座组成，每种基座都有其作用（装饰也算作用qwp）。</p>
    <img src="../../images/documentation/catalysts/some_catalysts.png" alt="催化剂示意图">
    <p>有的基座充当输入，有的充当输出。当你把合适的链素放到对应的基座上时，催化剂会发动，在输出基座上生成新链素。</p>
    <img src="../../images/documentation/catalysts/aq_with_input.png" alt="装有输入，还没来得及反应的aq催化">
    <p>催化剂通常会追踪活性位点，如果有多个位点的话，会随机选择一个</p>
    <img src="../../images/documentation/catalysts/aq_outputing_AQQI.png" alt="以QQI的第一个Q为位点的aq反应产物"/>
    <img src="../../images/documentation/catalysts/aq_outputing_QAQI.png" alt="以QQI的第二个Q为位点的aq反应产物"/>
    <p>催化剂可以旋转，可以共用基座，但不可以镜像</p>
    <img src="../../images/documentation/catalysts/rotating_n_sharing.png" alt="三个方向的aq，两aq共用基座"/>

</body>
