<body>
    <h4>运输</h4>
    <p>游戏按回合移动链素。每回合的移动具体机制如下：</p>
    <p>运输器会尝试挪动范围内的链素。</p>
    <p>如果有多个运输器同时挪动同一个链素，那么链素的移动会是多个分运动的矢量和。</p>
    <p>如果链素处在滑道上，那么它不再受到运输器的影响，而是保持上滑道时的速度。</p>
    <p>如果链素目的地被占用，或者多个链素尝试前往同一个位置，那么链素不会移动。这不会重置滑道上物品的速度。</p>
    <h4>运输器大全</h4>
    <p>涡轮器Vortexer 让周围一圈的链素逆时针公转，本身会挡住链素。</p>
    <p>推斥器Repulsor 推开周围一圈的链素，本身会挡住链素。</p>
    <p>滑道Slide 不施力，但保留链素上回合的速度。本身不会挡住链素。</p>
</body>
</html>
