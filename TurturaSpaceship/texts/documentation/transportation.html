<body>
    <h4>运输</h4>
    <p>游戏按回合移动链素。运输器给链素积攒力，物品每回合根据力的矢量和进行跳跃移动。</p>
    <p>每个回合：</p>
    <p>运输器给范围内的链素施加力</p>
    <p>链素所受力之和即为链素的移动，如果链素所处位置为滑道的话，还会额外重复上个回合的移动</p>
    <p>如果链素目的地被占用，或者多个链素尝试前往同一个位置，那么链素不会移动</p>
    <h4>运输器大全</h4>
    <p>涡轮器Vortexer 给周围一圈的链素施加逆时针公转的力，会阻挡物体。</p>
    <p>推斥器Repulsor 给周围一圈的链素施加离心的推力，会阻挡物体。</p>
    <p>滑道Slide 不施力，但保留链素上回合的速度。不会阻挡物体。</p>
</body>
</html>
