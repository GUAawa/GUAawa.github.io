<body>
    <h4>gq保护</h4>
    <p>...Q... + G -> ...G... + Q</p>
    <p>reactant + appendix -> product + waste</p>
    <h4>gq去保护</h4>
    <p>...G... + Q -> ...Q... + G</p>
    <p>reactant + appendix -> product + waste</p>
    <p>这是一个双反应催化剂，用于保护和去保护反应。它将链素的其中一个 Q/G 用 G/Q 替代掉。</p>
    <p>根据字元守恒，被替代的字元会落下来，你需要额外花些功夫处置它们。</p>

</body>
