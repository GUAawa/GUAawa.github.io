    <h4>链素 Stryng</h4>
    <p>链素是物质中能够独立存在并保持该物质字母学性质的最小单位，由两个或更多字元排列组成。</p>
    <p>字元是字母学的基本粒子，共28种，包括 A-Z 及 ( ) 。</p>
    <p>为了合成新的链素，Turtura 需要用基座摆出催化剂，再用运输器把底物链素置于相应基座上以发动反应。</p>
